<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#06070b">
<meta name="color-scheme" content="dark">
<title>Signal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Signal">
<style>
:root{
  --bg:#06070b; --surf:#15171d; --surf2:#1d2028; --inset:#0a0b0f;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --text:#f7f8fb; --muted:#9a9eab; --dim:#5f636f;
  --lime:#d9ff3f; --ink:#10140a; --cyan:#4fd1ff; --red:#ff4d42; --orange:#ff9f0a; --green:#30d158; --violet:#9b8cff; --pink:#ff6fb5;
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.22,1,.36,1);
  --serif:ui-serif,"New York",Georgia,serif;
}
html{background:#06070b;min-height:100%;-webkit-text-size-adjust:100%}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;border:none;background:none}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;background:transparent;color:var(--text);font-size:16px;line-height:1.4;min-height:calc(100vh + 1px);padding-bottom:calc(40px + env(safe-area-inset-bottom));overflow-x:hidden}
.hidden{display:none!important}
#amb{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:linear-gradient(180deg,#080a14 0%,#06070b 55%,#07060d 100%)}
#amb i{position:absolute;border-radius:50%}
#amb i:nth-child(1){width:90vw;height:90vw;left:-25vw;top:-28vw;background:radial-gradient(circle,rgba(79,140,255,.26),transparent 66%)}
#amb i:nth-child(2){width:80vw;height:80vw;right:-30vw;top:48vh;background:radial-gradient(circle,rgba(155,140,255,.16),transparent 66%)}
@keyframes d1{to{transform:translate(14vw,10vw) scale(1.12)}}
@keyframes d2{to{transform:translate(-16vw,-12vw) scale(1.18)}}
header{position:sticky;top:0;z-index:50;background:rgba(6,7,11,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(14px + env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;border-radius:11px;flex:none;background:radial-gradient(circle at 32% 28%,#fff,#aeb1bd 70%);display:grid;place-items:center;box-shadow:0 0 18px rgba(217,255,63,.28)}
.logo svg{width:18px;height:18px}
@keyframes breathe{50%{box-shadow:0 0 30px rgba(217,255,63,.5);transform:scale(1.06)}}
h1{font-family:var(--serif);font-variant:small-caps;font-size:25px;font-weight:600;letter-spacing:.6px;flex:1}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--surf);color:var(--muted);display:grid;place-items:center;transition:transform .4s var(--spring),color .2s}
.ib:active{transform:scale(.88);color:var(--text)}
.ib svg{width:20px;height:20px}
.ib.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wrap{max-width:520px;margin:0 auto;padding:16px 14px}
.rise>*{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes popin{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.card{background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:14px}
.lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.1px}
/* time budget */
.budget{display:flex;align-items:center;gap:16px}
.bud-t{flex:1;min-width:0}
.bud-t b{font-size:20px;font-weight:700}
.bud-t span{color:var(--muted);font-size:14px}
.bar{height:8px;background:var(--inset);border-radius:99px;overflow:hidden;box-shadow:0 0 0 1px var(--line) inset;margin-top:9px}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#9be22b,var(--lime));box-shadow:0 0 14px rgba(217,255,63,.6);transition:width .9s var(--ease),background .4s}
.bar.warn i{background:linear-gradient(90deg,#ff9f0a,#ff6a35);box-shadow:0 0 14px rgba(255,120,40,.6)}
.bar.full i{background:var(--red);box-shadow:0 0 14px rgba(255,77,66,.7)}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 15px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);font-size:14px;font-weight:600;display:flex;gap:7px;align-items:center;transition:all .3s var(--spring)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--lime));box-shadow:0 0 8px var(--c,var(--lime))}
.chip em{font-style:normal;background:rgba(255,255,255,.1);border-radius:99px;padding:0 7px;font-size:12px}
.chip.on{background:var(--lime);color:var(--ink);border-color:transparent;transform:scale(1.05)}
.chip.on em{background:rgba(0,0,0,.15)}
.chip:active{transform:scale(.93)}
/* video cards */
.sec{display:flex;align-items:center;justify-content:space-between;margin:6px 4px 12px}
.vid{display:block;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:14px;box-shadow:0 8px 18px -12px rgba(0,0,0,.8);transition:transform .2s var(--ease);animation:rise .4s var(--ease) both;animation-delay:calc(var(--i,0)*35ms);content-visibility:auto;contain-intrinsic-size:auto 290px}
.vid:active{transform:scale(.97)}
.th{position:relative;aspect-ratio:16/9;background:var(--inset);overflow:hidden}.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.55))}
.play{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(10,11,15,.62);border:1px solid rgba(255,255,255,.28);display:grid;place-items:center;z-index:2;transition:transform .35s var(--spring)}
.vid:active .play{transform:scale(1.15)}
.play svg{width:22px;height:22px;margin-left:3px}
.tag{position:absolute;left:12px;top:12px;z-index:2;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--lime);color:var(--ink)}
.newdot{position:absolute;right:12px;top:12px;z-index:2;width:12px;height:12px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px rgba(217,255,63,.8)}

.vb{padding:12px 14px 14px}
.vt{font-weight:600;font-size:16px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vm{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--muted)}
.vm i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
.vm b{color:var(--text);font-weight:600}
.vid.seen{opacity:.55}
.vid.seen .th{filter:grayscale(.7)}
.vid.compact{display:flex;align-items:center;gap:12px;padding:8px;border-radius:16px;margin-bottom:8px;box-shadow:none;contain-intrinsic-size:auto 76px}
.vid.compact .th{width:96px;flex:none;border-radius:12px}
.vid.compact .th::after,.vid.compact .play,.vid.compact .tag{display:none}
.vid.compact .vb{padding:0;flex:1;min-width:0}
.vid.compact .vt{font-size:14.5px}
/* empty / caught up */
.done{text-align:center;padding:34px 10px 26px}
.ring{width:96px;height:96px;margin:0 auto 14px}
.ring circle{fill:none;stroke:var(--lime);stroke-width:5;stroke-linecap:round;stroke-dasharray:289;stroke-dashoffset:289;animation:draw 1s .15s var(--ease) forwards;filter:drop-shadow(0 0 8px rgba(217,255,63,.6))}
.ring path{fill:none;stroke:var(--lime);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .6s .8s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done h2{font-family:var(--serif);font-variant:small-caps;font-size:26px;font-weight:600}
.done p{color:var(--muted);font-size:14.5px;margin-top:6px}
.more{display:block;width:100%;padding:13px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);font-weight:600;font-size:15px;margin:2px 0 14px;transition:transform .25s var(--spring)}
.more:active{transform:scale(.95)}
/* sheets */
#sheet{position:fixed;inset:0;z-index:800;display:none;align-items:flex-end;background:rgba(0,0,0,0);transition:background .3s}
#sheet.show{display:flex;background:rgba(0,0,0,.72)}
#sheet.show .sbox{animation:up .5s var(--spring) both}
#sheet.closing{background:rgba(0,0,0,0)}
#sheet.closing .sbox{animation:down .28s ease-in both}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes down{to{transform:translateY(100%)}}
.sbox{width:100%;max-width:520px;margin:0 auto;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.01)),var(--surf);border:1px solid var(--line2);border-bottom:none;border-radius:30px 30px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:94vh;overflow-y:auto;box-shadow:0 -30px 60px rgba(0,0,0,.6)}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line2);margin:0 auto 14px}
.sbox h2{font-family:var(--serif);font-variant:small-caps;font-size:25px;font-weight:600;margin-bottom:12px}
.player{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line2)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ptitle{font-weight:600;font-size:17px;margin:14px 2px 4px}
.btn{display:block;width:100%;min-height:48px;padding:12px 18px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.06);font-size:16px;font-weight:600;margin-top:10px;text-align:center;text-decoration:none;color:var(--text);transition:transform .22s var(--spring)}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--lime);color:var(--ink);border-color:transparent;box-shadow:0 10px 28px -8px rgba(217,255,63,.55)}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.crow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.crow:last-child{border:none}
.crow i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
.crow span{margin-left:auto;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px}
.ok{background:rgba(48,209,88,.16);color:#5be68a}.chk{background:rgba(255,159,10,.16);color:#ffb340}.bad{background:rgba(255,77,66,.16);color:#ff7a70}
.crow small{display:block;color:var(--muted);font-size:12px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{padding:10px 16px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);font-weight:600;font-size:14px;transition:all .25s var(--spring)}
.seg button.on{background:var(--lime);color:var(--ink);border-color:transparent;transform:scale(1.05)}
.note{font-size:13px;color:var(--muted);margin:6px 0 10px}
.hh{font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.lock{text-align:center;padding:14px 6px 8px}
.lock .big{font-size:54px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.player video{position:absolute;inset:0;width:100%;height:100%;background:#000}
.pl-load{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;font-size:14px;text-align:center;padding:16px;z-index:2}
.pl-load.hidden{display:none}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tools button{padding:9px 14px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.05);font-size:14px;font-weight:600;color:var(--muted)}
.tools button.on{background:var(--lime);color:var(--ink);border-color:transparent}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.step label{font-size:15px}.step small{display:block;color:var(--muted);font-size:12px}
.stp{display:flex;align-items:center;gap:6px}
.stp button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:var(--surf2);font-size:20px;font-weight:600}
.stp b{min-width:64px;text-align:center;font-size:16px}
.fld{margin:10px 0}.fld label{display:block;font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.fld input,.fld select{width:100%;min-height:46px;padding:10px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--inset);color:var(--text);font-size:16px;font-family:inherit}
.fld input:focus{outline:none;border-color:var(--lime)}
.crow.tap{cursor:pointer}.crow .chev{margin-left:auto;color:var(--dim);font-size:20px}
.crow .chev+span{margin-left:8px}
.res{display:flex;gap:12px;align-items:center;padding:8px;border-radius:16px;border:1px solid var(--line);background:var(--surf);margin-bottom:8px;width:100%;text-align:left}
.res img{width:96px;aspect-ratio:16/9;border-radius:10px;object-fit:cover;background:var(--inset);flex:none}
.res .vt{font-size:14.5px}.res .vm{margin-top:4px}
.empty{color:var(--muted);text-align:center;padding:22px 6px;font-size:14px}
.btn.danger{color:#ff7a70;border-color:rgba(255,77,66,.4)}
.ib.sm{width:40px;height:40px}
.rbar{height:4px;border-radius:9px;background:var(--inset);margin-top:8px;overflow:hidden}.rbar i{display:block;height:100%;background:var(--lime);border-radius:9px}
#list.still .vid,#list.still .done{animation:none}
.vm span{color:var(--muted)}.vm b{max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div id="amb"><i></i><i></i></div>
<header>
  <div class="logo"><svg viewBox="0 0 24 24" fill="#10140a"><path d="M8 5v14l11-7z"/></svg></div>
  <h1>Signal</h1>
  <button class="ib" id="search" aria-label="Chercher"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
  <button class="ib" id="refresh" aria-label="Actualiser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
  <button class="ib" id="info" aria-label="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
</header>
<main class="wrap">
  <div class="card" id="budget"></div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</main>
<div id="sheet"><div class="sbox"><div class="grab" id="grab"></div><div id="sbody"></div></div></div>

<script>
const VERSION=10;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const td=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function ld(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function st(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const COLS=['#4fd1ff','#d9ff3f','#ff9f0a','#9b8cff','#ff6fb5','#30d158','#ff6a5c','#5ee0c8'];
const colOf=n=>COLS[[...String(n)].reduce((a,c)=>a+c.charCodeAt(0),0)%COLS.length];
const uid=()=>Math.random().toString(36).slice(2,9);

/* ---------- state ---------- */
let DATA=ld('sig_cache',{updated:null,channels:[],videos:[]});   // collected by the server script
let CH=ld('sig_ch',null);                                         // channels followed (edited in the app)
let VID=ld('sig_vids',{});                                        // channel key -> videos fetched by the app
let seen=ld('sig_seen',{});
let POS=ld('sig_pos',{});                                          // id -> {t,d,u,m}: where each unfinished video was left
let timeLog=ld('sig_time',{});
let LIM=ld('sig_lim2',null);
if(!LIM){const o=ld('sig_limit',60);LIM={wk:o,we:o,finish:false}}
let CFG=Object.assign({per:3,age:10,res:'auto',mode:'native',autopip:true,apis:[]},ld('sig_cfg',{}));
if(CFG.age>30||!CFG.age)CFG.age=30;
if(!CFG.m3){if(CFG.age===14||CFG.age===30)CFG.age=10;CFG.m2=CFG.m3=1;st('sig_cfg',CFG)}
let filter='all',showSeen=false,playing=null;
const saveCH=()=>st('sig_ch',CH),saveCFG=()=>st('sig_cfg',CFG),saveLIM=()=>st('sig_lim2',LIM),saveVID=()=>st('sig_vids',VID);

function ago(v){
  if(typeof v==='string'&&!/^\d{4}-/.test(v))return v;
  const t=typeof v==='number'?v:new Date(v).getTime();
  const m=(Date.now()-t)/60000;
  if(m<60)return 'il y a '+Math.max(1,Math.round(m))+' min';
  const h=m/60;if(h<24)return 'il y a '+Math.round(h)+' h';
  const d=Math.round(h/24);if(d<31)return d===1?'hier':'il y a '+d+' j';
  const mo=Math.round(d/30.4);return mo<12?'il y a '+mo+' mois':'il y a '+Math.round(mo/12)+' an'+(mo>=24?'s':'');
}
const dayLimit=()=>{const g=new Date().getDay();return (g===0||g===6)?(LIM.we==null?LIM.wk:LIM.we):LIM.wk};
const spent=()=>Math.floor((timeLog[td()]||0)/60);
const locked=()=>dayLimit()>0&&spent()>=dayLimit();
const fmtMin=m=>m<=0?'Aucune':m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+String(m%60).padStart(2,'0'):'');

/* ---------- network helpers (the app talks to public services; each step has fallbacks) ---------- */
const DEF_API=['https://pipedapi.kavin.rocks','https://pipedapi.leptons.xyz','https://api.piped.private.coffee','https://inv.nadeko.net','https://yewtu.be','https://invidious.nerdvpn.de'];
const PROXIES=[u=>'https://corsproxy.io/?'+encodeURIComponent(u),u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u)];
const H=ld('sig_h',{});                                  // host -> {ok,bad} timestamps: dead services are tried last
const hostOf=u=>{try{return new URL(u).host}catch(e){return u}};
function hNote(url,good){const h=hostOf(url),o=H[h]||(H[h]={});o[good?'ok':'bad']=Date.now();if(good&&o.bad&&o.bad<o.ok)delete o.bad;clearTimeout(hNote.t);hNote.t=setTimeout(()=>st('sig_h',H),1500)}
const hScore=h=>{const o=H[hostOf(h)];if(!o)return 1;const now=Date.now();if(o.bad&&(!o.ok||o.bad>o.ok)&&now-o.bad<6e5)return 3;return o.ok&&now-o.ok<36e5?0:1};
const byHealth=(list,key)=>list.map((x,i)=>[x,i]).sort((p,q)=>hScore(key(p[0]))-hScore(key(q[0]))||p[1]-q[1]).map(p=>p[0]);
const apiList=()=>byHealth([...new Set([...(CFG.apis||[]),...DEF_API].map(x=>String(x).replace(/\/+$/,'')))],x=>x);
async function tf(url,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||6000);try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);hNote(url,true);return r}catch(e){hNote(url,false);throw e}finally{clearTimeout(t)}}
const getJ=async(u,ms)=>(await tf(u,ms)).json(),getT=async(u,ms)=>(await tf(u,ms)).text();
/* tries the options one after the other, but starts the next one after 1.2 s without waiting for the slow one to fail */
function firstOk(fns,gap){
  gap=gap==null?1200:gap;
  return new Promise((res,rej)=>{
    const total=fns.length;if(!total)return rej(new Error('indisponible'));
    let idx=0,fails=0,done=false,last=null,timer=null;
    const launch=()=>{
      if(done||idx>=total)return;clearTimeout(timer);

function loadSrc(src,at){

async function togglePip(){

  openSheet(`<h2>Anciennes vidéos</h2>
  <div class="chips" style="margin-bottom:0" id="sc">${CH.map(c=>`<button class="chip ${c.k===sCh?'on':''}" data-k="${c.k}"><i style="--c:${colOf(c.name)}"></i>${esc(c.name)}</button>`).join('')}</div>
  <div class="row2"><div class="fld" style="flex:1;margin:0"><input id="sq" placeholder="Un titre, un mot…" enterkeyhint="search"></div><button class="btn primary" id="sgo" style="flex:none;width:auto;margin:0">Chercher</button></div>
  <div id="sres" style="margin-top:14px"><p class="empty">Cherche dans les vidéos de la chaîne, ou valide à vide pour voir ses dernières.</p></div>`);
  $('sc').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;sCh=b.dataset.k;[...$('sc').children].forEach(x=>x.classList.toggle('on',x===b))};
  const go=()=>doSearch($('sq').value.trim());
  $('sgo').onclick=go;$('sq').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  $('sres').onclick=e=>{const r=e.target.closest('[data-v]');if(r)play(r.dataset.v)};
}
function ytWalk(o,out){
  if(!o||typeof o!=='object')return;
  if(o.lockupViewModel&&/VIDEO/.test(o.lockupViewModel.contentType||'')&&o.lockupViewModel.contentId){out.push({id:o.lockupViewModel.contentId,title:'',published:'',len:''});return}
  if(o.videoRenderer&&o.videoRenderer.videoId){const v=o.videoRenderer;out.push({id:v.videoId,title:((v.title||{}).runs||[{}])[0].text||'',published:(v.publishedTimeText||{}).simpleText||'',len:(v.lengthText||{}).simpleText||''});return}
  for(const k in o)ytWalk(o[k],out);
}
async function searchChannel(ch,q){
  if(!ch.id)ch.id=await resolveHandle(ch.handle);
  const id=ch.id,fns=[];
  const norm=(arr)=>arr.filter(x=>x.id).map(x=>({id:x.id,title:x.title,published:x.published,len:x.len}));
  fns.push(()=>api(q?'/search?q='+encodeURIComponent(ch.name+' '+q)+'&filter=videos':'/channel/'+id,q?'/api/v1/channels/'+id+'/search?q='+encodeURIComponent(q):'/api/v1/channels/'+id+'/videos?sort_by=newest',
    d=>{if(!d)return null;const items=q?(d.items||[]).filter(x=>(x.uploaderUrl||'').includes(id)):(d.relatedStreams||[]);return items.length?norm(items.filter(x=>x.url).map(x=>({id:(/v=([\w-]{11})/.exec(x.url)||[])[1],title:x.title,published:x.uploaded>1e11?new Date(x.uploaded).toISOString():(x.uploadedDate||''),len:x.duration}))):null},
    d=>{const items=Array.isArray(d)?d.filter(x=>x.type==='video'||x.videoId):(d&&d.videos)||[];return items.length?norm(items.map(x=>({id:x.videoId,title:x.title,published:x.published?new Date(x.published*1000).toISOString():(x.publishedText||''),len:x.lengthSeconds}))):null}));
  const page='https://www.youtube.com/channel/'+id+(q?'/search?query='+encodeURIComponent(q):'/videos');
  viaProxy(page).forEach(f=>fns.push(async()=>{const html=await f();const m=/var ytInitialData = (\{.*?\});<\/script>/s.exec(html);if(!m)return null;const out=[];ytWalk(JSON.parse(m[1]),out);return out.length?norm(out):null}));
  return firstOk(fns);
}
async function doSearch(q){
  const ch=CH.find(c=>c.k===sCh);if(!ch)return;
  const box=$('sres');box.innerHTML='<p class="empty">Recherche…</p>';
  try{
    let res=await searchChannel(ch,q);
    res=res.filter(v=>!short(v)).slice(0,20);
    if(!res.length){box.innerHTML='<p class="empty">Rien trouvé.</p>';return}
    box.innerHTML=res.map(v=>{const o={id:v.id,title:v.title,channel:ch.name,published:v.published||'',thumb:'https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg'};VLOOK[v.id]=o;
      return `<button class="res" data-v="${esc(v.id)}"><img loading="lazy" src="${esc(o.thumb)}" alt=""><div><div class="vt">${esc(v.title)}</div><div class="vm"><i style="--c:${colOf(ch.name)}"></i>${esc(ago(v.published)||'')}</div></div></button>`}).join('');
  }catch(e){box.innerHTML='<p class="empty">Recherche indisponible pour l\'instant. Les services publics sont parfois en panne, réessaie dans un moment ou ajoute un autre serveur dans les réglages.</p>'}
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if($('sheet').contains(e.target))return;
  const v=e.target.closest('.vid');if(v){play(v.dataset.id);return}
  const c=e.target.closest('.chip');if(c){filter=c.dataset.f;showSeen=false;PAGE=12;animNext=true;render();return}
  if(e.target.id==='toggleSeen'){showSeen=!showSeen;render()}
  if(e.target.id==='morefresh'){PAGE+=12;render()}
  if(e.target.id==='retry-all')load(true)
});
$('info').onclick=rInfo;
$('search').onclick=()=>rSearch();
$('refresh').onclick=()=>load(true);

let loading=false,lastLoad=0,prog={n:0,t:0},lastErr=0;
async function load(force){
  if(loading)return;loading=true;lastLoad=Date.now();
  const b=$('refresh');b.classList.add('spin');
  const srv=fetch('videos.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{if(d&&((d.videos||[]).length||!(DATA.videos||[]).length)){DATA=d;st('sig_cache',DATA)}}).catch(()=>{});
  try{await seedChannels()}catch(e){}
  if(!playing)render();
  try{await Promise.all([refreshChannels(force===true),srv])}catch(e){}
  loading=false;
  setTimeout(()=>b.classList.remove('spin'),300);
  if(!playing)render();
}
render();load();
setInterval(()=>{if(!document.hidden&&!playing)load()},10*60*1000);
</script>
